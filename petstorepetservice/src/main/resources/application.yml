spring:
  application:
    name: petstorepetservice
  cloud:
    azure:
      keyvault:
        secret:
          property-sources[0]:
            endpoint: https://om-petstore-keyvault.vault.azure.net/
          credential:
            managed-identity-enabled: true
  datasource:
    url: ${petservicedburl}
    username: ${petservicedbusername}
    password: ${petservicedbpassword}
#    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      data-locations: classpath:/petservice.sql
#      mode: always
server:
  port: ${PETSTOREPETSERVICE_SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  show-actuator: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      show-components: always
  health:
    ssl:
      enabled: false
    diskspace:
      enabled: false

logging:
  level:
    com.azure.spring: DEBUG
    com.azure.security: DEBUG